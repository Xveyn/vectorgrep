name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    env:
      # onnxruntime-node's install script otherwise downloads CUDA binaries from
      # nuget.org. Tests only use the bundled CPU binaries, and that download
      # regularly times out and fails `npm ci`.
      ONNXRUNTIME_NODE_INSTALL: skip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.node-version != '22.x'
        run: npm test

      # Coverage is measured once, on Node 22. The thresholds in vitest.config.ts
      # fail this step when coverage drops below the floor.
      - name: Test with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Coverage summary
        if: always() && matrix.node-version == '22.x' && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"].map(
              (metric) => `| ${metric} | ${total[metric].pct}% | ${total[metric].covered} / ${total[metric].total} |`
            );
            console.log(["### Coverage", "", "| Metric | Covered | Count |", "|---|---|---|", ...rows].join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY"
